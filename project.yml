name: Shakhsaha
options:
  bundleIdPrefix: com.moha700m
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  Shakhsaha:
    type: application
    platform: iOS
    sources: [Shakhsaha]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.shakhsaha
        PRODUCT_NAME: Shakhsaha
        INFOPLIST_FILE: Shakhsaha/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
  ShakhsahaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShakhsahaTests]
    dependencies:
      - target: Shakhsaha
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moha700m.shakhsaha.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Shakhsaha:
    build:
      targets:
        Shakhsaha: all
        ShakhsahaTests: [test]
    test:
      targets: [ShakhsahaTests]
